name: PR Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-lint-typecheck:
    name: Lint & Typecheck (PR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # Repo-wide `eslint .` is already red on main (~2k Prettier nits).
      # Gate this PR on the TypeScript it actually changes.
      - name: Lint changed TypeScript
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          mapfile -d '' files < <(
            git diff --name-only --diff-filter=ACMR -z "origin/${{ github.base_ref }}...HEAD" \
              | grep -zE '\.(ts|tsx)$' || true
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No TypeScript files changed"
            exit 0
          fi
          echo "Linting ${#files[@]} files"
          bunx eslint "${files[@]}"
      - run: bun run typecheck

  pr-test:
    name: Tests (PR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run test

  pr-build:
    name: Build (PR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build

  pr-size:
    name: PR Size Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });
            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });
            // Vendored IDL JSON and fixtures dwarf real review surface and
            // made the 500-change gate fail every AEON recovery PR.
            const ignore = /src\/lib\/indexer\/idl\/|__tests__\/fixtures\/|routeTree\.gen\.ts$|\/__tests__\//;
            const counted = files.data.filter((f) => !ignore.test(f.filename));
            const totalChanges = counted.reduce((sum, f) => sum + f.changes, 0);
            console.log(`PR #${pr.number}: ${files.data.length} files, ${totalChanges} counted changes (${files.data.length - counted.length} ignored)`);
            if (totalChanges > 2500) {
              core.setFailed(`PR too large: ${totalChanges} counted changes. Consider splitting.`);
            }
